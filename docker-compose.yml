version: '3.8'

services:
  smart-survey-hub:
    build: .
    container_name: smart-survey-hub
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
